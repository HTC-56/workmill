name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # The zero-setup engine. This job is what a stranger reproduces by cloning the
  # repo and running `pnpm install && pnpm test` with nothing else installed.
  pglite:
    name: suite on PGlite (no database installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # verify.sh IS the four gates: typecheck, test, the public-repo scrub and
      # the README command lint. Running the script rather than its first two
      # steps means a gate added to it is a gate CI gains for free — the
      # reservation "the CI workflow will need a verify step once more gates
      # exist", discharged.
      - run: bash verify.sh
      # The deployable artefact, built from the tree the gates just passed.
      - run: pnpm build

  # The authoritative engine. Concurrency cases PGlite cannot express — two
  # claimants competing for the same rows — only ever run here.
  postgres:
    name: suite on Postgres 16 (authoritative)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: workmill_ci
          POSTGRES_DB: workmill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://postgres:workmill_ci@localhost:5432/workmill_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
